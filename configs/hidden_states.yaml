train_dataset:
  _target_: src.dataset.ConcatedDataset
  dataset_list:
    # - ${FigStep}
    # - ${VLSafe_normal}
    # - ${VLSafe_harmful}
    # - ${VLGuard}
    - ${MMSafetyBench}
    - ${MMSafetyBench_benign}
    # - ${MMVet}
    # - ${PGDAdvBench}
    # - ${SPA_VL_harmful}
    # - ${SPA_VL_normal}


val_dataset: ${train_dataset}

batch_size: 4
seed: 0
debug: False
use_answer: False

select_layer: -1
select_token_index: -1
n_components: 20

defaults:
  - model: llava_7b
  - _self_