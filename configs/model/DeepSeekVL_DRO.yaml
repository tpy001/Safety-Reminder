_target_:  src.model.DRO_DeepSeekVL
pretrained_path: results/DRO/DeepSeekVL/prompt_embedding_iter_6.pth
model_path: weights/DeepseekVL-7b/
torch_dtype: bfloat16
max_context_length: 1024
device: auto
trainable: frozen
generate_config:
    type: GenerationConfig
    return_full_text: false
    use_cache: true
    bos_token_id: 100000
    do_sample: false
    eos_token_id: 100001
    pad_token_id: 100001
    # temperature: 0.6
    # top_p: 0.9
    max_new_tokens: 256

peft_config:
    num: 8
    dim: 4096
    prompt_text: <soft_prompt>
    init_text: If the input is unsafe, refuse to answer. Otherwise, respond helpfully


harmful_classfier_path: assets/DRO_deepsekkVL/pca_harmfulness.npz
refusal_classfier_path: assets/DRO_deepsekkVL/pca_refusal.npz
